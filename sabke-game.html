<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabke Game - Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    font-family: 'Segoe UI', sans-serif;
    color: #fff;
    padding: 20px;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  h1 {
    font-size: 2rem;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #00ff87, #60efff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .scoreboard {
    display: flex;
    gap: 30px;
    margin-bottom: 15px;
    font-size: 1.1rem;
  }
  .scoreboard span { color: #60efff; font-weight: bold; }
  canvas {
    background: #0a0a1a;
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(0, 255, 135, 0.3);
    max-width: 100%;
    touch-action: none;
  }
  .controls {
    margin-top: 20px;
    display: grid;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(2, 60px);
    gap: 8px;
  }
  .controls button {
    background: rgba(96, 239, 255, 0.15);
    border: 1px solid #60efff;
    color: #60efff;
    font-size: 1.5rem;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.15s;
  }
  .controls button:active {
    background: #60efff;
    color: #0a0a1a;
    transform: scale(0.95);
  }
  .up { grid-column: 2; grid-row: 1; }
  .left { grid-column: 1; grid-row: 2; }
  .down { grid-column: 2; grid-row: 2; }
  .right { grid-column: 3; grid-row: 2; }
  #restart {
    margin-top: 20px;
    padding: 10px 30px;
    font-size: 1rem;
    background: linear-gradient(90deg, #00ff87, #60efff);
    color: #0a0a1a;
    border: none;
    border-radius: 25px;
    font-weight: bold;
    cursor: pointer;
  }
  #restart:active { transform: scale(0.95); }
  .hint { margin-top: 12px; font-size: 0.85rem; opacity: 0.6; }
</style>
</head>
<body>
  <h1>🐍 Sabke Game</h1>
  <div class="scoreboard">
    <div>Score: <span id="score">0</span></div>
    <div>High: <span id="high">0</span></div>
  </div>
  <canvas id="game" width="400" height="400"></canvas>

  <div class="controls">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◄</button>
    <button class="down" data-dir="down">▼</button>
    <button class="right" data-dir="right">►</button>
  </div>

  <button id="restart">Restart</button>
  <p class="hint">Arrow keys / WASD / Swipe bhi chalta hai</p>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highEl = document.getElementById('high');

const GRID = 20;
const CELL = canvas.width / GRID;

let snake, dir, nextDir, food, score, highScore, speed, lastTime, gameOver;

highScore = Number(localStorage.getItem('snakeHigh') || 0);
highEl.textContent = highScore;

function init() {
  snake = [{x: 10, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  speed = 150;
  lastTime = 0;
  gameOver = false;
  placeFood();
  scoreEl.textContent = 0;
}

function placeFood() {
  do {
    food = {
      x: Math.floor(Math.random() * GRID),
      y: Math.floor(Math.random() * GRID)
    };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function update() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver = true;
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('snakeHigh', highScore);
      highEl.textContent = highScore;
    }
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    placeFood();
    if (speed > 60) speed -= 3;
  } else {
    snake.pop();
  }
}

function draw() {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // grid
  ctx.strokeStyle = 'rgba(96, 239, 255, 0.05)';
  for (let i = 0; i <= GRID; i++) {
    ctx.beginPath();
    ctx.moveTo(i * CELL, 0);
    ctx.lineTo(i * CELL, canvas.height);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * CELL);
    ctx.lineTo(canvas.width, i * CELL);
    ctx.stroke();
  }

  // food
  ctx.fillStyle = '#ff4d6d';
  ctx.shadowColor = '#ff4d6d';
  ctx.shadowBlur = 15;
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL/2, food.y * CELL + CELL/2, CELL/2 - 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // snake
  snake.forEach((s, i) => {
    const t = i / snake.length;
    ctx.fillStyle = i === 0 ? '#00ff87' : `hsl(${160 - t * 60}, 100%, ${60 - t * 25}%)`;
    ctx.shadowColor = '#00ff87';
    ctx.shadowBlur = i === 0 ? 15 : 5;
    ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
  });
  ctx.shadowBlur = 0;

  if (gameOver) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ff4d6d';
    ctx.font = 'bold 40px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 10);
    ctx.fillStyle = '#60efff';
    ctx.font = '20px Segoe UI';
    ctx.fillText('Score: ' + score, canvas.width/2, canvas.height/2 + 30);
  }
}

function loop(time) {
  if (!lastTime) lastTime = time;
  const delta = time - lastTime;

  if (!gameOver && delta > speed) {
    update();
    lastTime = time;
  }

  draw();
  requestAnimationFrame(loop);
}

function setDir(newDir) {
  const dirs = { up: {x:0,y:-1}, down: {x:0,y:1}, left: {x:-1,y:0}, right: {x:1,y:0} };
  const nd = dirs[newDir];
  if (!nd) return;
  if (nd.x === -dir.x && nd.y === -dir.y) return;
  nextDir = nd;
}

document.addEventListener('keydown', e => {
  const map = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right'
  };
  if (map[e.key]) {
    e.preventDefault();
    setDir(map[e.key]);
  }
});

document.querySelectorAll('.controls button').forEach(btn => {
  btn.addEventListener('click', () => setDir(btn.dataset.dir));
});

// swipe
let touchStart = null;
canvas.addEventListener('touchstart', e => {
  touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });

canvas.addEventListener('touchend', e => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  if (Math.abs(dx) > Math.abs(dy)) {
    setDir(dx > 0 ? 'right' : 'left');
  } else {
    setDir(dy > 0 ? 'down' : 'up');
  }
  touchStart = null;
}, { passive: true });

document.getElementById('restart').addEventListener('click', init);

init();
requestAnimationFrame(loop);
</script>
</body>
</html>
